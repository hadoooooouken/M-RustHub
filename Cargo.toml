[package]
name = "m_rusthub"
version = "1.1.1"
edition = "2024"
authors = ["hadouken"]
license = "MIT"
description = "Lightweight open-source alternative to official MCHOSE HUB driver for MCHOSE G3 V2 mouse"
repository = "https://github.com/hadoooooouken/M-RustHub"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
hidapi = "2.6"
raw-window-handle = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winres = "0.1.12"
