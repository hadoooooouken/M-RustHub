[package]
name = "m_rusthub"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native lightweight configuration utility for MCHOSE G3 V2 mouse"
repository = "https://github.com/hadoooooouken/M-RustHub"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow"] }
hidapi = "2.6"

[build-dependencies]
winres = "0.1.12"
